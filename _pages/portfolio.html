---
layout: archive
title: "Portfolio"
permalink: /portfolio/
---

{% include base_path %}

{% for post in site.portfolio %}
<div style="display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; margin-bottom: 2rem;">
  {% if post.header.teaser %}
  <a href="{{ post.link | default: post.url }}" style="flex: 1 1 280px; max-width: 360px;">
    <img src="{{ base_path }}{{ post.header.teaser }}" alt="{{ post.title }}" style="width: 100%; border: 1px solid #ddd; border-radius: 4px;">
  </a>
  {% endif %}
  <div style="flex: 1 1 260px; min-width: 0;">
    <h2 style="margin-top: 0;">
      {% if post.link %}
        <a href="{{ post.link }}">{{ post.title }}</a>
      {% else %}
        <a href="{{ base_path }}{{ post.url }}">{{ post.title }}</a>
      {% endif %}
    </h2>
    {{ post.content | markdownify }}
  </div>
</div>
{% endfor %}
